# Builds EDIplayer for Windows x64, Linux x64 and Android on every push and pull request.
# Pushing a tag that starts with "v" (e.g. v1.0.0) also publishes the builds as a GitHub release.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/EDIplayer | Out-Null
          Copy-Item build/Release/EDIplayer.exe, build/Release/edi-probe.exe, README.md dist/EDIplayer/
          Compress-Archive -Path dist/EDIplayer -DestinationPath EDIplayer-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EDIplayer-windows-x64
          path: EDIplayer-windows-x64.zip

  linux:
    # The oldest supported runner, so the binary runs on older glibc versions too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Package
        run: |
          mkdir -p dist/EDIplayer
          cp build/EDIplayer build/edi-probe README.md dist/EDIplayer/
          strip dist/EDIplayer/EDIplayer dist/EDIplayer/edi-probe
          tar -czf EDIplayer-linux-x64.tar.gz -C dist EDIplayer
      - uses: actions/upload-artifact@v4
        with:
          name: EDIplayer-linux-x64
          path: EDIplayer-linux-x64.tar.gz

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install the NDK and CMake
        run: sdkmanager "ndk;30.0.16248370" "cmake;3.31.6" "platforms;android-36"
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$v"
          echo "VERSION_ARGS=-PversionName=$v -PversionCode=$((major * 10000 + minor * 100 + ${patch:-0}))" >> "$GITHUB_ENV"
      - name: Release key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "EDIPLAYER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: No release key
        if: env.HAS_KEY != 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Releases need the signing key secrets (see README, Android)"
          exit 1
      - name: Build
        working-directory: android
        env:
          EDIPLAYER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EDIPLAYER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EDIPLAYER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease $VERSION_ARGS --no-daemon
      - name: Package
        run: cp android/app/build/outputs/apk/release/app-release.apk EDIplayer-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EDIplayer-android
          path: EDIplayer-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            EDIplayer-windows-x64.zip
            EDIplayer-linux-x64.tar.gz
            EDIplayer-android.apk
          generate_release_notes: true
